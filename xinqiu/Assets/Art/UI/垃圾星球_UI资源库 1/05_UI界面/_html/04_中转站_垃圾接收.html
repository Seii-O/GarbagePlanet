<!doctype html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0B0A09;color:#33261A;
  font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.screen{position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate}
.scene{position:absolute;inset:0;z-index:0}
.scrim{position:absolute;inset:0;z-index:1;
  background:radial-gradient(120% 100% at 50% 46%,rgba(12,10,8,.32) 0%,rgba(9,8,6,.62) 58%,rgba(7,6,5,.8) 100%)}
.grain{position:absolute;inset:0;z-index:2;opacity:.028;pointer-events:none;
  background-image:radial-gradient(#fff 1.1px,transparent 1.1px);background-size:4px 4px}
.liq{font-family:Bahnschrift,"Segoe UI",Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.up{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#8A7256}
.dim{color:#6B5842}
.cy{color:#0E6B60}.am{color:#A9691A}.rd{color:#C0503A}

/* ============ 面板：浅奶油纸面 + 细边 + 柔和投影 ============ */
.panel{position:absolute;z-index:5;overflow:hidden;border-radius:34px;
  background:linear-gradient(178deg,#FFFEFA 0%,#FCF5E7 42%,#F6EAD4 100%);
  border:2px solid rgba(86,63,40,.15);
  box-shadow:0 26px 54px rgba(9,7,4,.5),0 2px 0 rgba(255,255,255,.9) inset,
             inset 0 -12px 26px rgba(198,168,124,.14)}
.panel::before{content:'';position:absolute;left:-6%;right:-6%;top:-70px;height:230px;z-index:0;pointer-events:none;
  background:radial-gradient(58% 100% at 46% 0,rgba(58,199,178,.15),rgba(58,199,178,0) 72%)}
.panel::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
.cn{display:none}
.phead{position:relative;display:flex;align-items:center;height:92px;padding:0 34px;
  border-bottom:1px dashed rgba(86,63,40,.16)}
.ptitle{display:flex;align-items:center;gap:14px;font-size:29px;font-weight:800;letter-spacing:.04em;color:#2E2317}
.ptitle::before{content:'';width:28px;height:28px;border-radius:10px;flex:none;transform:rotate(-8deg);
  background:linear-gradient(150deg,#8CEADB,#2FBBA3 68%,#1B8E7D);
  box-shadow:0 6px 14px rgba(35,167,148,.35),inset 0 2px 0 rgba(255,255,255,.7)}
.close{position:absolute;right:26px;top:26px;width:38px;height:38px;border-radius:50%;z-index:4;
  border:2px solid rgba(86,63,40,.14);background:#FFFCF6;color:#7A6650;font-size:14px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(40,28,16,.12)}

/* ============ 页签：分段胶囊 ============ */
.tabs{display:flex;align-items:center;height:74px;gap:8px;padding:0 26px;
  border-bottom:1px dashed rgba(86,63,40,.16);background:none;box-shadow:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;height:46px;padding:0 22px;
  font-size:17px;font-weight:700;color:#7A6650;letter-spacing:.02em;border-radius:23px;border:2px solid transparent}
.tab .no{font-size:10px;color:#AE9B80;font-weight:800;letter-spacing:.1em}
.tab.on{color:#0A5F55;background:#fff;border-color:rgba(47,187,163,.42);
  box-shadow:0 8px 18px rgba(35,167,148,.18),inset 0 1px 0 #fff}
.tab.on .no{color:#2FBBA3}
.tab.on::after{display:none}

/* ============ 按钮：胶囊 ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;
  font-size:18px;font-weight:800;letter-spacing:.03em;border-radius:999px;border:0;white-space:nowrap}
.btn.pri{background:linear-gradient(180deg,#5EDCC7 0%,#28AC98 62%,#1C9282 100%);color:#04352F;
  box-shadow:0 10px 20px rgba(30,151,133,.32),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.sec{background:linear-gradient(180deg,#FFE3AB 0%,#F5BF66 62%,#EBAE4E 100%);color:#4A3008;
  box-shadow:0 10px 20px rgba(226,168,74,.3),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.gh{background:#FFFDF8;color:#5E4B37;box-shadow:inset 0 0 0 2px rgba(86,63,40,.15),0 6px 16px rgba(40,28,16,.1)}
.btn.dis{background:#EDE2CE;color:#A89678;box-shadow:inset 0 0 0 2px rgba(86,63,40,.07)}
.btn.sm{height:44px;padding:0 20px;font-size:15px;border-radius:999px}

/* ============ 格子：浅凹槽 ============ */
.cell{position:relative;border-radius:22px;
  background:linear-gradient(180deg,#FFFEF9,#F4E8D4);
  border:1.5px solid rgba(86,63,40,.12);display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 3px 8px rgba(160,130,92,.16),0 2px 0 rgba(255,255,255,.8)}
.cell.on{border-color:rgba(47,187,163,.55);background:linear-gradient(180deg,#FFFEF9,#F1F5EA);
  box-shadow:0 0 0 3px rgba(47,187,163,.14),0 8px 16px rgba(40,28,16,.08),inset 0 2px 6px rgba(160,130,92,.1)}
.cell.sel{border-color:#1FA896;background:linear-gradient(180deg,#E9FBF6,#D3F2EA);
  box-shadow:0 0 0 4px rgba(47,187,163,.18),0 8px 18px rgba(35,167,148,.2)}
.cell.empty{border-style:dashed;border-color:rgba(86,63,40,.2);background:rgba(255,253,247,.5);box-shadow:none}
.cell img{width:80%;height:80%;object-fit:contain;
  filter:drop-shadow(0 4px 6px rgba(80,58,34,.22))}
.cell .cnt{position:absolute;right:8px;bottom:4px;font-size:22px;font-weight:800;color:#A9691A;
  font-family:Bahnschrift,Consolas,monospace;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.cell .cnt.zero{color:#AE9B80}

/* ============ 进度条：浅槽 + 圆头滑块 ============ */
.bar{position:relative;background:#E6D7BA;border-radius:99px;
  border:0;box-shadow:inset 0 2px 4px rgba(120,92,56,.24)}
.bar>i{display:block;height:100%;border-radius:99px;position:relative;
  background:linear-gradient(180deg,#FFD184,#EFB257 62%,#E0A03F);
  box-shadow:0 2px 6px rgba(214,152,66,.35)}
.bar>i::after{content:'';position:absolute;right:-2px;top:50%;width:12px;height:12px;border-radius:50%;
  transform:translateY(-50%);background:#FFFDF7;border:2px solid #E0A03F;
  box-shadow:0 2px 6px rgba(120,80,30,.28)}
.bar>u{position:absolute;inset:0;border-radius:99px;pointer-events:none;background:none}
.bar.cy>i{background:linear-gradient(180deg,#7DE7D6,#2FBDAA 62%,#1FA793);box-shadow:0 2px 6px rgba(35,167,148,.3)}
.bar.cy>i::after{border-color:#1FA793}
.bar.gn>i{background:linear-gradient(180deg,#CBE3B0,#96C077 62%,#7DA85F)}
.bar.gn>i::after{border-color:#7DA85F}
.bar.rd>i{background:linear-gradient(180deg,#FFB49B,#E2705A 62%,#C65440)}
.bar.rd>i::after{border-color:#C65440}
.grid-l{display:none}
.hdiv{border-top:1px dashed rgba(86,63,40,.22);background:none}
.vdiv{border-left:1px dashed rgba(86,63,40,.2);background:none}

/* ============ HUD：浅色浮层 ============ */
.hud{position:absolute;z-index:6}
.hcard{border-radius:24px;
  background:linear-gradient(180deg,rgba(255,253,247,.97),rgba(246,236,218,.97));
  border:1.5px solid rgba(86,63,40,.16);
  box-shadow:0 14px 30px rgba(8,6,3,.42),inset 0 1px 0 rgba(255,255,255,.9)}
.cross{position:absolute;z-index:7;width:78px;height:78px;left:50%;top:50%;transform:translate(-50%,-50%)}
.cross i{position:absolute;background:#FFFDF7;
  box-shadow:0 0 0 1.5px rgba(40,28,16,.5),0 2px 6px rgba(0,0,0,.45);border-radius:3px}
.cross .h{width:16px;height:3px;top:37px}.cross .h.l{left:5px}.cross .h.r{right:5px}
.cross .v{width:3px;height:16px;left:37px}.cross .v.t{top:5px}.cross .v.b{bottom:5px}
.cross .dot{width:8px;height:8px;border-radius:50%;left:35px;top:35px;background:#22A794;
  border:1.5px solid #FFFDF7;box-shadow:0 0 10px rgba(34,167,148,.9)}
.tag{display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:999px;
  background:rgba(255,253,247,.96);border:1.5px solid rgba(47,187,163,.55);
  font-size:16px;font-weight:700;color:#2E2317;letter-spacing:.02em;
  box-shadow:0 8px 18px rgba(8,6,3,.34)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 10px;
  border-radius:10px;border:1.5px solid rgba(86,63,40,.2);
  background:linear-gradient(180deg,#FFFDF7,#F2E7D3);font-size:13px;font-weight:800;color:#5E4B37;
  box-shadow:0 3px 0 rgba(86,63,40,.16),inset 0 1px 0 #fff}

/* ============ 内联元素：圆角与线色兜底 ============ */
.panel div:not([class]),.hud div:not([class]){border-radius:14px}
.panel .phead,.panel .tabs,.panel .hdiv,.panel .vdiv,.panel .bar,.panel .bar>i,
.panel .bar>u,.hud .hdiv{border-radius:0}
.panel .bar,.panel .bar>i,.panel .bar>u,.hud .bar,.hud .bar>i{border-radius:999px}
.panel .btn,.hud .btn{border-radius:999px}
.panel .prog,.hud .prog{border-radius:99px}
.panel .cell,.panel .cell img{border-radius:22px}
.panel .medal,.panel .medal img,.panel .rosette,.panel .step-no{border-radius:50%}
.panel .sticker,.panel .tag,.hud .tag,.hud .key{border-radius:999px}
.panel .card{border-radius:26px}

/* ============ 旧深色卡片 → 浅奶油卡片 ============ */
.panel div[style*="#63503B"],.panel div[style*="#4E3F2C"],.panel div[style*="#3E3122"],
.panel div[style*="#4C3E30"],.panel div[style*="#3A2E23"],.panel div[style*="#2C2219"]{
  background:linear-gradient(180deg,#FFFDF8 0%,#F9EFDC 58%,#F3E6CF 100%)!important;
  border:1.5px solid rgba(86,63,40,.14)!important;
  box-shadow:0 10px 24px rgba(40,28,16,.1),inset 0 1px 0 rgba(255,255,255,.9)!important}
.panel div[style*="rgba(0,0,0,.1"],.panel div[style*="rgba(0,0,0,.2"],
.panel div[style*="rgba(0,0,0,.3"],.hud div[style*="rgba(0,0,0,.1"]{
  background:rgba(255,255,255,.55)!important;box-shadow:none!important}
.panel div[style*="border:1px solid #453D33"],.panel div[style*="border:1px solid #3A352A"],

.panel div[style*="border-bottom:1px solid rgba(255,255,255,.06)"],
.panel div[style*="border-top:1px solid rgba(255,255,255,.07)"]{
  border-color:rgba(86,63,40,.16)!important;border-style:dashed!important}
.panel div[style*="border-bottom:1px solid rgba(255,255,255,.08)"]{
  border-color:rgba(86,63,40,.18)!important;border-style:dashed!important}
.panel div[style*="border-right:1px solid #352F27"],.panel div[style*="border-left:1px solid #352F27"]{
  border-color:rgba(86,63,40,.16)!important;border-style:dashed!important}
.hud div[style*="rgba(20,18,16,.94)"],.hud div[style*="rgba(24,18,16,.95)"],.hud div[style*="rgba(20,18,16,.95)"]{
  background:rgba(255,253,247,.96)!important;border-color:rgba(86,63,40,.14)!important;border-radius:18px!important}

/* ============ 文字对比：浅底深字 ============ */
.panel [style*="color:#FBF5E8"],.panel [style*="color:#F3EEE1"],.panel [style*="color:#EFE9DB"],
.panel [style*="color:#E8DFCC"],.panel [style*="color:#DCD5C6"],.panel [style*="color:#FCF6E7"],
.hud [style*="color:#E8DFCC"],.hud [style*="color:#D3CCBC"]{color:#33261A!important}
.panel [style*="color:#D3CCBC"],.panel [style*="color:#C6BFAD"],.panel [style*="color:#C0B6A1"],
.panel [style*="color:#B5AB97"],.panel [style*="color:#F0E6CF"],

.panel [style*="color:#A79E8B"],.panel [style*="color:#9A9282"],
.hud [style*="color:#A79E8B"],.hud [style*="color:#9A9282"]{color:#7E6A52!important}
.panel [style*="color:#8E8676"],.panel [style*="color:#8B8373"],.panel [style*="color:#7E7666"],
.panel [style*="color:#6B6252"],

.panel [style*="color:#0A2621"],.panel [style*="color:#15594E"]{color:#0A5F55!important}

/* 页签文字（在被覆盖容器之外） */
.tab{margin:0}

/* ============ 纸卡 / 徽章 / 贴纸 / 奖章 ============ */
.card{background:linear-gradient(180deg,#FFFEFB 0%,#FBF2E1 68%,#F7EBD6 100%);
  border:1.5px solid rgba(86,63,40,.13);border-radius:26px;
  box-shadow:0 12px 26px rgba(40,28,16,.10),inset 0 1px 0 #fff}
.medal{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;
  border:1.5px solid rgba(86,63,40,.1);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.85),0 6px 14px rgba(60,42,24,.13)}
.sticker{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
  font-size:12px;font-weight:800;transform:rotate(-2.5deg);
  box-shadow:0 6px 12px rgba(40,28,16,.12);border:1.5px solid transparent}
.rosette{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#FFFDF6,#F5E9D2 60%,#EBDCBE 100%);
  box-shadow:0 16px 32px rgba(40,28,16,.16),inset 0 3px 0 #fff,
             0 0 0 9px rgba(255,255,255,.5),0 0 0 11px rgba(47,187,163,.28)}
.dots{height:0;border-top:2px dotted rgba(86,63,40,.24)}
.step-no{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;
  font-family:Bahnschrift,Consolas,monospace;font-weight:700;
  background:#FFFEF9;border:1.5px solid rgba(86,63,40,.16);color:#8A7256;
  box-shadow:0 4px 10px rgba(40,28,16,.08)}
.step-no.on{background:linear-gradient(180deg,#5EDCC7,#25A794);border-color:#1C9282;color:#04352F;
  box-shadow:0 6px 14px rgba(35,167,148,.3)}
.step-no.done{background:#EFF6E6;border-color:rgba(125,168,95,.5);color:#4F7A39}

/* HUD 内的深色底条统一转浅 */
.hud div[style*="rgba(18,16,14"],.hud div[style*="rgba(24,18,16"],
.hud div[style*="rgba(30,26,22"],.hud div[style*="rgba(20,18,16"],
.hud[style*="rgba(20,18,16"],.hud[style*="rgba(24,18,16"],.hud[style*="rgba(18,16,14"]{

  box-shadow:0 12px 26px rgba(8,6,3,.38)!important;color:#33261A!important}
.hud[style*="#4FE0C8"]{border-left-color:#2FBBA3!important}
.hud[style*="#C0573A"]{border-left-color:#D2705A!important}
.hud img{filter:drop-shadow(0 3px 5px rgba(60,42,24,.25))}

/* 图标统一圆角与柔和投影 */
.panel img{border-radius:10px}
